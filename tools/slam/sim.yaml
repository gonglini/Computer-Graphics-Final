# FAST-LIO configuration for the LiDAR Drive simulator (VLP-32C-like sensor, IMU at the LiDAR origin)
common:
    lid_topic:  "/velodyne_points"
    imu_topic:  "/imu/data"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 2                # Velodyne-style PointCloud2 (x y z intensity time ring)
    scan_line: 32
    scan_rate: 10                # Hz
    timestamp_unit: 0            # the 'time' field is in seconds
    blind: 2.0

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     150.0
    extrinsic_est_en:  false
    extrinsic_T: [ 0.0, 0.0, 0.0 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1 ]

publish:
    path_en:  true
    scan_publish_en:  true
    dense_publish_en: false
    scan_bodyframe_pub_en: false

pcd_save:
    pcd_save_en: true
    interval: 400                # a map file every 400 scans while it runs (no huge write at shutdown)
